name: pepeuch-ai-poc

services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: pepeuch_ai
      POSTGRES_USER: pepeuch_ai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepeuch_ai -d pepeuch_ai"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: /opt/pepeuch-ai/config/postgres-password

networks:
  backend:
    internal: true